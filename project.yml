name: HeartSyncChecker
options:
  bundleIdPrefix: com.heartsync
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Base language of Resources/Localizable.xcstrings ("sourceLanguage": "en"). Pinned rather
  # than left to XcodeGen's default so the project's developmentRegion, the catalog's source
  # language, and the CFBundleDevelopmentRegion that XcodeGen writes into Resources/Info.plist
  # as $(DEVELOPMENT_LANGUAGE) can never drift apart. knownRegions is not a spec key in
  # XcodeGen 2.46; it is derived (Base + this language + any .lproj found), which is why the
  # matching DEVELOPMENT_LANGUAGE build setting is declared below.
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 7RLDYXQTNX
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    # -- Localization ---------------------------------------------------------------------
    # The app calls String(localized:) in ~80 places and uses SwiftUI Text literals
    # throughout, but without these the compiler emits no .stringsdata, nothing reaches
    # Resources/Localizable.xcstrings, and `xcodebuild -exportLocalizations` hands a
    # translator an empty catalog. That matters more here than in most apps: a large share of
    # those strings are medical caveats (the blood-pressure disclaimer, the "neither device is
    # a reference standard" language, the insufficient-evidence wording), and shipping to a
    # non-English reader without them means shipping health claims with the caveats stripped.
    #
    # These affect extraction only. They do not change any string's runtime value: every
    # String(localized:) carries an English defaultValue, so an untranslated build renders
    # exactly what it renders today.
    DEVELOPMENT_LANGUAGE: en
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    LOCALIZATION_EXPORT_SUPPORTED: YES

targets:
  HeartSyncChecker:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
        buildPhase: resources
        excludes: ["Info.plist", "HeartSyncChecker.entitlements"]
    dependencies:
      - sdk: libsqlite3.tbd
      - target: HeartSyncWatch
        embed: true
    info:
      path: Resources/Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: "HeartSync uses Bluetooth to discover, connect to, and read measurements from nearby health sensors."
        NSHealthShareUsageDescription: "HeartSync reads heart and related measurements from Apple Health so you can compare your devices."
        NSHealthUpdateUsageDescription: "HeartSync saves directly measured Bluetooth readings to Apple Health when you enable mirroring."
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.heartsync.HeartSyncChecker.oura-oauth
            CFBundleURLSchemes:
              - com.heartsync.heartsyncchecker
        UIBackgroundModes:
          - bluetooth-central
        # Without UILaunchScreen the app is treated as a pre-iOS-14 binary and gets
        # letterboxed on modern devices; App Store validation warns on it too.
        UILaunchScreen: {}
        # TARGETED_DEVICE_FAMILY includes iPad, and an iPad app must declare all four
        # orientations unless it opts out of multitasking with UIRequiresFullScreen.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Resources/HeartSyncChecker.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # HealthKitManager.startObserving calls enableBackgroundDelivery(for:frequency:.hourly),
        # which the system only honours when the app is entitled for it. Declaring it here keeps
        # the code's intent and the app's provisioning in agreement.
        #
        # This is a capability, not just a plist key: the App ID com.heartsync.HeartSyncChecker
        # must have HealthKit *and* its background-delivery capability enabled in the developer
        # portal (team 7RLDYXQTNX), otherwise provisioning-profile generation fails with
        # "doesn't support the HealthKit Background Delivery capability" at signing time.
        #
        # Verify only with a SIGNED build on a physical iPhone: confirm the embedded
        # HeartSync.app/embedded.mobileprovision carries the entitlement, then background the app
        # and check that new Health samples arrive without a foreground refresh. A simulator build
        # proves nothing here -- it is unsigned, entitlements are not enforced, and no real
        # background wake occurs.
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heartsync.HeartSyncChecker
        PRODUCT_NAME: HeartSync
        # The bundle is HeartSync.app, but the Swift module keeps the project name so
        # `@testable import HeartSyncChecker` resolves.
        PRODUCT_MODULE_NAME: HeartSyncChecker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Resources/HeartSyncChecker.entitlements

  HeartSyncWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp/Sources
      - path: Shared
      - path: Sources/Model/MetricKind.swift
      - path: Sources/Model/DiscrepancySeverity.swift
      - path: Sources/Model/Provenance.swift
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: WatchApp/Resources
        buildPhase: resources
        excludes: ["Info.plist", "HeartSyncWatch.entitlements"]
    dependencies:
      - target: HeartSyncWatchComplications
        embed: true
    info:
      path: WatchApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: HeartSync
        CFBundleURLTypes:
          - CFBundleURLName: com.heartsync.HeartSyncChecker.watchkitapp.complications
            CFBundleURLSchemes: [heartsync-watch]
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.heartsync.HeartSyncChecker
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "HeartSync reads your heart rate during workouts to show live measurements on Apple Watch."
        NSHealthUpdateUsageDescription: "HeartSync saves workouts and their heart-rate readings to Apple Health when you choose Save."
    entitlements:
      path: WatchApp/Resources/HeartSyncWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.heartsync.HeartSyncChecker.watch
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heartsync.HeartSyncChecker.watchkitapp
        PRODUCT_NAME: HeartSyncWatch
        PRODUCT_MODULE_NAME: HeartSyncWatch
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: WatchApp/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchApp/Resources/HeartSyncWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  HeartSyncWatchComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchComplications/Sources
      - path: Shared/WatchSnapshot.swift
      - path: Shared/WatchComplication.swift
      - path: Shared/WatchComplicationStore.swift
      - path: Sources/Model/MetricKind.swift
      - path: Sources/Model/DiscrepancySeverity.swift
      - path: Sources/Model/Provenance.swift
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    info:
      path: WatchComplications/Resources/Info.plist
      properties:
        CFBundleDisplayName: HeartSync Complications
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchComplications/Resources/HeartSyncWatchComplications.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.heartsync.HeartSyncChecker.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heartsync.HeartSyncChecker.watchkitapp.complications
        PRODUCT_NAME: HeartSyncWatchComplications
        PRODUCT_MODULE_NAME: HeartSyncWatchComplications
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: WatchComplications/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchComplications/Resources/HeartSyncWatchComplications.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  HeartSyncCheckerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: HeartSyncChecker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heartsync.HeartSyncCheckerTests
        GENERATE_INFOPLIST_FILE: YES
        # The app target is named HeartSyncChecker but ships as HeartSync.app, so the
        # generated TEST_HOST default points at a path that does not exist.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HeartSync.app/HeartSync"
        BUNDLE_LOADER: "$(TEST_HOST)"

  HeartSyncCheckerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: HeartSyncChecker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heartsync.HeartSyncCheckerUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HeartSyncChecker

  HeartSyncCheckerPerformanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PerformanceTests
    dependencies:
      - target: HeartSyncChecker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heartsync.HeartSyncCheckerPerformanceTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HeartSync.app/HeartSync"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  HeartSyncWatch:
    build:
      targets:
        HeartSyncWatch: all

  HeartSyncChecker:
    build:
      targets:
        HeartSyncChecker: all
        HeartSyncCheckerTests: [test]
        HeartSyncCheckerUITests: [test]
    test:
      targets:
        - HeartSyncCheckerTests
        - HeartSyncCheckerUITests

  HeartSyncCheckerPerformance:
    build:
      targets:
        HeartSyncChecker: all
        HeartSyncCheckerPerformanceTests: [test]
    test:
      targets:
        - HeartSyncCheckerPerformanceTests
