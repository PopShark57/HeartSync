name: iOS validation

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Select an available iPhone simulator
        shell: bash
        run: |
          simulator_id="$(
            xcrun simctl list devices available -j |
            python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; runtimes=sorted(((tuple(map(int,key.rsplit("iOS-",1)[1].split("-"))),devices) for key,devices in data.items() if ".iOS-" in key and tuple(map(int,key.rsplit("iOS-",1)[1].split("-"))) >= (18,)),reverse=True); print(next(device["udid"] for _,devices in runtimes for device in devices if device["name"].startswith("iPhone")))'
          )"
          echo "HEARTSYNC_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Run unit and UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project HeartSyncChecker.xcodeproj \
            -scheme HeartSyncChecker \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$HEARTSYNC_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/HeartSyncChecker-DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HeartSyncChecker-tests
          path: ${{ runner.temp }}/HeartSyncChecker-DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 14
